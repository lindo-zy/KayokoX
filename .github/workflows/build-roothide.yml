name: Build KayokoX roothide

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: KayokoX-roothide-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: iOS ${{ matrix.ios }} / SDK ${{ matrix.sdk }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios: ios16
            sdk: '16.5'
          - ios: ios17
            sdk: '17.0'

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup roothide Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: roothide/theos
          sdks-src: xybp888/iOS-SDKs

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "${THEOS}"
          test -d "${THEOS}/sdks/iPhoneOS${{ matrix.sdk }}.sdk"
          test -x "${THEOS}/bin/ldid" || command -v ldid
          xcodebuild -version
          make --version | head -n 1
          echo "Using THEOS=${THEOS}"
          echo "Using SDK=${THEOS}/sdks/iPhoneOS${{ matrix.sdk }}.sdk"

      - name: Build roothide package
        shell: bash
        env:
          THEOS_PACKAGE_SCHEME: roothide
          TARGET: iphone:clang:${{ matrix.sdk }}:14.0
        run: |
          set -euo pipefail
          make clean
          make package FINALPACKAGE=1

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(packages/*.deb)
          if (( ${#packages[@]} == 0 )); then
            echo 'No Debian package was produced.' >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            echo "Produced ${package}"
            test -s "${package}"
            file "${package}"
          done

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: KayokoX-roothide-${{ matrix.ios }}-sdk-${{ matrix.sdk }}
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(release-assets/*/*.deb)
          if (( ${#packages[@]} < 2 )); then
            echo "Expected at least two Debian packages, found ${#packages[@]}." >&2
            exit 1
          fi

          for package in "${packages[@]}"; do
            artifact_name="$(basename "$(dirname "${package}")")"
            package_name="$(basename "${package}")"
            cp "${package}" "release-assets/${artifact_name}-${package_name}"
          done

          ls -l release-assets/*.deb

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          assets=(release-assets/*.deb)

          if gh release view "${tag}" --repo "${repo}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --repo "${repo}" --clobber
          else
            gh release create "${tag}" "${assets[@]}" --repo "${repo}" \
              --title "KayokoX ${tag}" \
              --generate-notes
          fi
